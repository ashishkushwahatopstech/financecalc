<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us – FinCalc Tools</title>
  <meta name="description" content="Get in touch with FinCalc Tools support for questions, business inquiries, or calculator suggestions." />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/src/index.css" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col antialiased">

  <!-- ================= Shared Header / Navigation ================= -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="index.html" class="group flex items-center gap-3 font-extrabold text-slate-900 tracking-tight shrink-0 select-none">
        <div class="relative flex items-center justify-center">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 via-teal-600 to-emerald-800 p-0.5 shadow-md shadow-emerald-600/20 group-hover:shadow-emerald-600/30 group-hover:scale-105 transition-all duration-200">
            <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center relative overflow-hidden">
              <div class="absolute inset-0 bg-gradient-to-tr from-emerald-500/10 to-transparent"></div>
              <svg class="w-5 h-5 text-emerald-400 group-hover:text-emerald-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
          </div>
        </div>
        <div class="flex flex-col">
          <span class="text-xl font-black tracking-tight text-slate-900">Fin<span class="text-emerald-600">Calc</span></span>
          <span class="text-[10px] font-bold text-slate-400 tracking-wider uppercase mt-0.5">Smart Tools Suite</span>
        </div>
      </a>

      <!-- User Auth Profile Dropdown / Google Sign In -->
      <div id="navbar-auth-container" class="flex items-center gap-2">
        <div class="w-24 h-8 bg-slate-100 animate-pulse rounded-lg"></div>
      </div>
    </div>
  </header>

  <!-- ================= Main Content ================= -->
  <main class="flex-grow max-w-lg mx-auto px-4 sm:px-6 py-12 w-full">
    <div class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-10 shadow-2xs space-y-6">
      <div>
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">Contact Us</h1>
        <p class="text-xs text-slate-400 mt-1">Have feedback or suggestions? Drop us a message below.</p>
      </div>

      <form id="contact-form" class="space-y-4">
        <div>
          <label for="contact-name" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
          <input 
            type="text" 
            id="contact-name" 
            required 
            placeholder="John Doe" 
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all"
          />
        </div>

        <div>
          <label for="contact-email" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
          <input 
            type="email" 
            id="contact-email" 
            required 
            placeholder="john@example.com" 
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all"
          />
        </div>

        <div>
          <label for="contact-subject" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Subject</label>
          <input 
            type="text" 
            id="contact-subject" 
            required 
            placeholder="Suggestion for tax calculator..." 
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all"
          />
        </div>

        <div>
          <label for="contact-message" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Message</label>
          <textarea 
            id="contact-message" 
            rows="4" 
            required 
            placeholder="Write your message here..." 
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all"
          ></textarea>
        </div>

        <button 
          type="submit" 
          class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-all shadow-md shadow-emerald-600/10 cursor-pointer flex items-center justify-center gap-1.5"
        >
          <span>Send Message</span>
        </button>
      </form>
    </div>
  </main>

  <!-- ================= Shared Footer ================= -->
  <footer class="bg-slate-900 text-slate-400 text-xs border-t border-slate-800 mt-16 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto text-center">
      <p>© 2026 FinCalc Tools. All rights reserved.</p>
      <div class="mt-4 flex justify-center gap-4 text-xs">
        <a href="index.html" class="hover:text-white">Home</a>
        <a href="about.html" class="hover:text-white">About Us</a>
        <a href="contact.html" class="hover:text-white">Contact</a>
        <a href="privacy-policy.html" class="hover:text-white">Privacy Policy</a>
        <a href="terms-of-service.html" class="hover:text-white">Terms of Service</a>
        <a href="disclaimer.html" class="hover:text-white">Disclaimer</a>
      </div>
    </div>
  </footer>

  <!-- Toast Notification Wrapper -->
  <div id="toast-wrapper" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

  <!-- Firebase & Global Auth Module -->
  <script type="module" src="/js/auth.js?v=1.0.2"></script>

  <script>
    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      // Inject standard toast display logic matching auth.js
      const wrapper = document.getElementById('toast-wrapper');
      const toast = document.createElement('div');
      toast.className = "flex items-center gap-3 px-4 py-3 bg-slate-900 text-white text-xs font-semibold rounded-xl shadow-lg border border-slate-800 animate-slide-in pointer-events-auto";
      toast.innerHTML = `
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
        <span>Message sent successfully! We'll reply soon.</span>
      `;
      wrapper.appendChild(toast);
      
      e.target.reset();
      setTimeout(() => {
        toast.className = "flex items-center gap-3 px-4 py-3 bg-slate-900 text-white text-xs font-semibold rounded-xl shadow-lg border border-slate-800 animate-fade-out pointer-events-auto";
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    });
  </script>

</body>
</html>
